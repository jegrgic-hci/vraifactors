<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AEGIS_SYSTEM | Branching Tree Architecture</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface": "#e5e2e1",
                    "secondary": "#ffb4aa",
                    "primary-fixed": "#cfe5ff",
                    "inverse-surface": "#e5e2e1",
                    "surface-bright": "#3a3939",
                    "inverse-on-surface": "#313030",
                    "surface-container-highest": "#353534",
                    "surface-container": "#201f1f",
                    "on-tertiary-fixed": "#2f1500",
                    "tertiary": "#ffb77d",
                    "on-background": "#e5e2e1",
                    "secondary-fixed": "#ffdad5",
                    "on-secondary": "#690003",
                    "surface-dim": "#131313",
                    "on-secondary-fixed-variant": "#930005",
                    "on-primary-container": "#00375a",
                    "error-container": "#93000a",
                    "secondary-fixed-dim": "#ffb4aa",
                    "outline": "#88919d",
                    "surface-variant": "#353534",
                    "secondary-container": "#c5020b",
                    "surface-tint": "#98cbff",
                    "on-primary": "#003354",
                    "on-primary-fixed-variant": "#004a77",
                    "on-primary-fixed": "#001d33",
                    "surface-container-lowest": "#0e0e0e",
                    "primary-fixed-dim": "#98cbff",
                    "primary-container": "#00a3ff",
                    "tertiary-container": "#eb8104",
                    "surface-container-high": "#2a2a2a",
                    "on-surface-variant": "#bec7d4",
                    "on-error-container": "#ffdad6",
                    "inverse-primary": "#00629d",
                    "error": "#ffb4ab",
                    "on-tertiary-container": "#522900",
                    "on-secondary-fixed": "#410001",
                    "tertiary-fixed": "#ffdcc3",
                    "surface-container-low": "#1c1b1b",
                    "surface": "#131313",
                    "outline-variant": "#3f4852",
                    "tertiary-fixed-dim": "#ffb77d",
                    "on-error": "#690005",
                    "primary": "#98cbff",
                    "on-tertiary-fixed-variant": "#6e3900",
                    "on-tertiary": "#4d2600",
                    "on-secondary-container": "#ffd2cc",
                    "background": "#131313"
            },
            "fontFamily": {
                    "body-md": ["JetBrains Mono"],
                    "code-xs": ["JetBrains Mono"]

          }

<style>
        body {
            background-color: #131313;
            color: #e5e2e1;
            overflow: hidden;
            margin: 0;
            height: 100vh;
            width: 100vw;
        }

        .animated-grid {
            background-image: linear-gradient(#1a1a1a 1px, transparent 1px), linear-gradient(90deg, #1a1a1a 1px, transparent 1px);
            background-size: 60px 60px;
        }

        @keyframes slide-in-node {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .node {
            animation: slide-in-node 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            border: 1px solid #3f4852;
            background: #1a1a1a;
            position: absolute;
            z-index: 10;
            transition: all 0.5s ease;
        }

        .node.highlight {
            border-color: #98cbff;
            box-shadow: 0 0 15px rgba(152, 203, 255, 0.4);
            color: #cfe5ff;
        }

        .edge {
            position: absolute;
            height: 1px;
            background: #262626;
            transform-origin: left center;
            z-index: 5;
            transition: all 0.8s ease;
            opacity: 0;
            animation: fade-in 0.3s forwards;
        }

        @keyframes fade-in {
            to { opacity: 1; }
        }

        .edge.highlight {
            background: #98cbff;
            box-shadow: 0 0 8px rgba(152, 203, 255, 0.2);
            height: 2px;
        }

        #intervention-box {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95) translateY(10px);
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
            backdrop-filter: blur(8px);
        }

        #intervention-box.visible {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1) translateY(0);
        }

        /* Connecting line for callout */
        #intervention-connector {
            position: absolute;
            width: 40px;
            height: 1px;
            background: #98cbff;
            opacity: 0;
            z-index: 45;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #intervention-connector.visible {
            opacity: 1;
        }
    </style>
</head>
<body class="font-body-md overflow-hidden">
<main class="relative w-full h-full bg-[#131313] animated-grid" id="main-container">
<!-- Graph Container -->
<div class="absolute inset-0 overflow-hidden" id="graph-viewport"></div>
<!-- Intervention UI (Now dynamic positioning) -->
<div class="absolute w-96 bg-surface-container/90 border border-primary/40 p-6 z-50 shadow-2xl rounded-lg" id="intervention-box">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-primary text-sm">terminal</span>
<span class="text-[10px] font-code-xs text-outline tracking-widest uppercase">Routine Integrity Check</span>
</div>
<p class="text-on-surface text-xs leading-relaxed mb-6 font-code-xs">
        Safety brake active at <span class="text-primary" id="trigger-node-id">BRANCH_NODE</span>. Systematic review required for current architecture expansion.
    </p>
<div class="space-y-4">
<div class="bg-black/40 p-3 rounded border border-outline-variant">
<p class="text-[10px] text-outline mb-1 font-code-xs">ADMIN_PROMPT: VALIDATE COMPLEXITY?</p>
<input class="w-full bg-transparent border-none focus:ring-0 text-sm font-code-xs text-primary p-0 placeholder-outline-variant uppercase" placeholder="TYPE 'AUTH' TO RESUME..." type="text"/>
</div>
<div class="flex gap-2">
<button class="flex-1 border border-outline-variant text-outline text-[11px] font-bold py-2 hover:bg-surface-variant transition-all uppercase rounded">Prune</button>
<button class="flex-1 bg-primary text-on-primary text-[11px] font-bold py-2 hover:brightness-110 transition-all uppercase rounded">Authorize</button>
</div>
</div>
</div>
<!-- Connection line for visual callout -->
<div id="intervention-connector"></div>
<!-- System Branding -->
<div class="absolute bottom-6 left-6 opacity-30 pointer-events-none">
<div class="font-code-xs text-outline tracking-widest flex flex-col gap-1">
<span class="">AEGIS_SYSTEM // COMPLEX_TREE_ARCH_V5</span>
<span class="" id="node-counter">NODES_ACTIVE: 00</span>
</div>
</div>
</main>
<script>
    const container = document.getElementById('graph-viewport');
    const interventionBox = document.getElementById('intervention-box');
    const interventionConnector = document.getElementById('intervention-connector');
    const nodeCounterEl = document.getElementById('node-counter');
    const triggerNodeIdEl = document.getElementById('trigger-node-id');
    
    const nodes = [];
    const edges = [];
    let nodeCount = 0;
    const maxNodes = 24;
    const triggerNodeThreshold = 14; 
    let isHalted = false;

    // Tree Configuration
    const startX = (window.innerWidth / 2) - (160 * 2.5);
    const startY = window.innerHeight / 2;
    const stepX = 160;
    const stepY = 140;

    function createNode(x, y, id, parent = null) {
        const node = document.createElement('div');
        node.className = 'node px-2 py-1 rounded text-[9px] text-outline font-code-xs select-none cursor-default';
        node.style.left = `${x}px`;
        node.style.top = `${y}px`;
        node.innerHTML = `NODE_${id}`;
        container.appendChild(node);
        
        const nodeObj = { x, y, el: node, id, parent, depth: parent ? parent.depth + 1 : 0 };
        nodes.push(nodeObj);
        
        if (parent) {
            edges.push(createEdge(parent, nodeObj));
        }
        
        nodeCount++;
        nodeCounterEl.textContent = `NODES_ACTIVE: ${nodeCount.toString().padStart(2, '0')}`;
        return nodeObj;
    }

    function createEdge(n1, n2) {
        const edge = document.createElement('div');
        edge.className = 'edge';
        const dx = n2.x - n1.x;
        const dy = n2.y - n1.y;
        const length = Math.sqrt(dx * dx + dy * dy);
        const angle = Math.atan2(dy, dx) * 180 / Math.PI;

        edge.style.width = `${length}px`;
        edge.style.left = `${n1.x + 25}px`; 
        edge.style.top = `${n1.y + 12}px`;
        edge.style.transform = `rotate(${angle}deg)`;
        
        container.appendChild(edge);
        return edge;
    }

    function triggerIntervention(highlightNode) {
        isHalted = true;
        
        // Position the terminal relative to the node
        const nodeRect = highlightNode.el.getBoundingClientRect();
        const boxX = nodeRect.right + 40;
        const boxY = nodeRect.top - 50;
        
        interventionBox.style.left = `${boxX}px`;
        interventionBox.style.top = `${boxY}px`;
        
        // Position the visual connector
        interventionConnector.style.left = `${nodeRect.right}px`;
        interventionConnector.style.top = `${nodeRect.top + (nodeRect.height / 2)}px`;
        interventionConnector.style.width = `40px`;
        
        interventionBox.classList.add('visible');
        interventionConnector.classList.add('visible');
        
        let current = highlightNode;
        triggerNodeIdEl.textContent = `NODE_${current.id}`;
        
        while (current) {
            current.el.classList.add('highlight');
            // Backtrack to highlight the path
            const childIndex = nodes.indexOf(current);
            if (childIndex > 0) {
                const edge = edges[childIndex - 1];
                if (edge) edge.classList.add('highlight');
            }
            current = current.parent;
        }
        
        highlightNode.el.classList.add('animate-pulse');
    }

    const buildQueue = [];

    function buildTreeStep() {
        if (isHalted || nodeCount >= maxNodes) return;

        if (nodes.length === 0) {
            // Origin node
            const root = createNode(startX, startY, "00");
            buildQueue.push(root);
        } else {
            const parent = buildQueue.shift();
            if (!parent) return;

            // Immediate branching: First node always spawns 2. 
            // Sub-nodes have a high probability of spawning 2 children to increase complexity.
            const isOrigin = parent.id === "00";
            const childCount = (isOrigin || (Math.random() > 0.4 && parent.depth < 3)) ? 2 : 1;
            
            for (let i = 0; i < childCount; i++) {
                if (nodeCount >= maxNodes) break;
                
                const idStr = nodeCount.toString().padStart(2, '0');
                
                // Calculate vertical spread based on sibling count and depth
                let offsetMultiplier;
                if (childCount === 2) {
                    offsetMultiplier = i === 0 ? -1 : 1;
                } else {
                    offsetMultiplier = Math.random() > 0.5 ? 0.6 : -0.6;
                }
                
                const nextX = parent.x + stepX;
                const nextY = parent.y + (offsetMultiplier * stepY * Math.pow(0.7, parent.depth));
                
                const newNode = createNode(nextX, nextY, idStr, parent);
                buildQueue.push(newNode);

                // Safety brake trigger
                if (nodeCount === triggerNodeThreshold) {
                    setTimeout(() => triggerIntervention(newNode), 600);
                    return;
                }
            }
        }

        setTimeout(buildTreeStep, 500);
    }

    // Initialize origin sequence
    setTimeout(buildTreeStep, 1000);
</script>
</body></html>
